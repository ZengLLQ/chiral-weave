name: ChiralWeave CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Type-check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests across all subcommands
        run: |
          python -m chiral_weave.cli inspect --smiles "CC(=O)Oc1ccccc1C(=O)O"
          python -m chiral_weave.cli dock --smiles "COc1cc2ncnc(Nc3ccc(F)c(Cl)c3)c2cc1OCCCN1CCOCC1" --steps 60 --seed 42
          python -m chiral_weave.cli protac --kd-target 15.0 --kd-e3 45.0 --alpha 6.5 --hours 24.0
          python -m chiral_weave.cli screen --clusters 4 --seed 42
          python -m chiral_weave.cli optimize --smiles "c1ccc(Nc2ncnc3ccccc23)cc1" --iterations 25 --seed 42
          python -m chiral_weave.cli benchmark --epochs 12 --seed 42

      - name: Run all standalone example workflows
        run: |
          python examples/01_smiles_descriptors_and_scaffolds.py
          python examples/02_gnn_adme_and_cyp_kinetics.py
          python examples/03_conformer_docking_and_protac_hook_effect.py
          python examples/04_mcts_pareto_lead_optimization.py
